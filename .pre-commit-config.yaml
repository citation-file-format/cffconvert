repos:

  - repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff
        alias: cffconvert
        name: Validating CITATION.cff using 'cffconvert'

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: Sorting Python import lines using 'isort'
        args:
          - "--check-only"
          - "--diff"

  - repo: https://github.com/regebro/pyroma
    rev: "4.2"
    hooks:
      - id: pyroma
        name: Assessing the package metadata using 'pyroma'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # 0.17.0
    hooks:
      - id: ruff
        name: Linting using 'ruff'

  - repo: https://github.com/PyCQA/prospector
    rev: 051d8abf6401a5dd4f4f01922ac569a48a4ab45c # 1.19.1
    hooks:
      - id: prospector
        name: Linting the code base using 'prospector'
        args: ["--profile-path", ".prospector.yml"]

  - repo: https://github.com/tcort/markdown-link-check
    rev: 275c27c5035a5b4a656fe0e21a4c1403c118c767 # 3.15.0
    hooks:
      - id: markdown-link-check
        args: [-q]
